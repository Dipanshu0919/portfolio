version: "3.9"

services:
  portfolio:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    # Limit resources — suitable for a small VPS
    mem_limit: 256m
    cpus: "0.5"
    # Read-only container filesystem where possible
    read_only: false  # needs /tmp for session state
    tmpfs:
      - /tmp:size=64m,mode=1777
    # No privileged access
    security_opt:
      - no-new-privileges:true
